[[stack]]
name = "nextcloud"
tags = [
  "files",
  "nextcloud",
  "mysql"
]
[stack.config]
server = "Local"
poll_for_updates = true
auto_update = true
linked_repo = "csery-komodo-stacks"
run_directory = "services/nextcloud"
file_paths = ["docker-compose.yaml"]
environment = """
# Host directories and logging
CONFIG_DIR=[[CONFIG_DIR]]
LOGGING_DRIVER=[[LOGGING_DRIVER]]

# Port configuration
PORT_NEXTCLOUD_HTTP=[[PORT_NEXTCLOUD_HTTP]]

# Nextcloud configuration
NEXTCLOUD_TAG=33-apache
NEXTCLOUD_INIT_HTACCESS=true
NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.[[DUCKDNS_SUBDOMAIN]].[[DUCKDNS_ZONE]]
NEXTCLOUD_TRUSTED_PROXIES=172.16.0.0/12

# MySQL configuration
MYSQL_TAG=8.4
NEXTCLOUD_MYSQL_DATABASE=nextcloud
NEXTCLOUD_MYSQL_USER=nextcloud-user
NEXTCLOUD_MYSQL_PASSWORD=[[NEXTCLOUD_MYSQL_PASSWORD]]
"""

