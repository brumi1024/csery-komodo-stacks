name: immich

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v2}
    container_name: immich-server
    restart: unless-stopped
    logging:
      driver: ${LOGGING_DRIVER:-local}
    depends_on:
      - database
      - redis
    environment:
      TZ: ${TZ:-Europe/Budapest}
      DB_HOSTNAME: database
      DB_PORT: 5432
      DB_USERNAME: ${IMMICH_DB_USERNAME:-postgres}
      DB_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in Komodo secrets}
      DB_DATABASE_NAME: ${IMMICH_DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: redis
      REDIS_PORT: 6379
    ports:
      - ${PORT_IMMICH_HTTP:-2283}:2283
    volumes:
      - /media/photos:/data
      - /etc/localtime:/etc/localtime:ro

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v2}
    container_name: immich-machine-learning
    restart: unless-stopped
    logging:
      driver: ${LOGGING_DRIVER:-local}
    environment:
      TZ: ${TZ:-Europe/Budapest}
    volumes:
      - ${CONFIG_DIR:?CONFIG_DIR is required}/immich/model-cache:/cache

  redis:
    image: docker.io/valkey/valkey:${IMMICH_REDIS_TAG:-9}
    container_name: immich-redis
    restart: unless-stopped
    logging:
      driver: ${LOGGING_DRIVER:-local}

  database:
    image: ghcr.io/immich-app/postgres:${IMMICH_POSTGRES_TAG:-14-vectorchord0.4.3-pgvectors0.2.0}
    container_name: immich-postgres
    restart: unless-stopped
    logging:
      driver: ${LOGGING_DRIVER:-local}
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD:?Set IMMICH_DB_PASSWORD in Komodo secrets}
      POSTGRES_USER: ${IMMICH_DB_USERNAME:-postgres}
      POSTGRES_DB: ${IMMICH_DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${CONFIG_DIR:?CONFIG_DIR is required}/immich/postgres:/var/lib/postgresql/data
